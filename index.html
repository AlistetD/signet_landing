<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/mark.png" />
    <link rel="preload" as="image" href="/brand/wordmark-light.png" />
    <link rel="preload" as="image" href="/brand/wordmark-dark.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta
      name="description"
      content="Работа консультантом в SigNet Team. Опыт не нужен — научим сами. График 2/2, белая зарплата дважды в месяц."
    />
    <title>Работа в SigNet — без штрафов, зарплата вовремя</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('signet-theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
          var color = dark ? '#000000' : '#f2f2f2'
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
            meta.setAttribute('content', color)
          })
        } catch (e) {
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
